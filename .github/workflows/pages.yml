# Publishes a static copy of the map to GitHub Pages. Each run starts the API,
# lets it collect live data for a few minutes, saves the responses as files and
# builds the web app against them. Visitors reload the page for newer data.
name: Publish map snapshot

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: npm ci
        working-directory: scripts-runner

      # Ice edge: Copernicus publishes it once a day, so it is fetched at most every
      # 12 hours and carried between runs. Skipped until the Copernicus secrets are set.
      - uses: actions/cache/restore@v6
        with:
          path: |
            data/source/overlays/ice-edge.geojson
            data/source/overlays/ice-edge.meta.json
          key: ice-edge-${{ github.run_id }}
          restore-keys: ice-edge-

      - name: Check ice edge age
        id: ice
        env:
          HAS_LOGIN: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME != '' }}
        run: |
          hours=$(python3 -c "import json, datetime as d; m = json.load(open('data/source/overlays/ice-edge.meta.json')); print(int((d.datetime.now(d.timezone.utc) - d.datetime.fromisoformat(m['generated_at'])).total_seconds() // 3600))")
          echo "Ice edge is ${hours}h old"
          if [ "$HAS_LOGIN" = true ] && [ "$hours" -ge 12 ]; then echo "update=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-python@v7
        if: steps.ice.outputs.update == 'true'
        with:
          python-version: '3.12'

      - name: Update ice edge
        id: ice_update
        if: steps.ice.outputs.update == 'true'
        # An old ice edge is better than no map
        continue-on-error: true
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: |
          pip install --quiet copernicusmarine matplotlib numpy xarray python-dotenv
          python scripts-runner/fetch_ice_edge.py

      - uses: actions/cache/save@v6
        if: steps.ice_update.outcome == 'success'
        with:
          path: |
            data/source/overlays/ice-edge.geojson
            data/source/overlays/ice-edge.meta.json
          key: ice-edge-${{ github.run_id }}

      # Ships seen in the last runs, so each snapshot is not limited to a few minutes of AIS
      - uses: actions/cache/restore@v6
        with:
          path: data/cache/aisstream-snapshot.json
          key: ais-snapshot-${{ github.run_id }}
          restore-keys: ais-snapshot-

      - name: Collect snapshot
        working-directory: scripts-runner
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          BW_CLIENT_ID: ${{ secrets.BW_CLIENT_ID }}
          BW_CLIENT_SECRET: ${{ secrets.BW_CLIENT_SECRET }}
          GFW_API_TOKEN: ${{ secrets.GFW_API_TOKEN }}
        run: |
          node --import tsx server.ts > "$RUNNER_TEMP/server.log" 2>&1 &
          server=$!
          npx tsx writeSiteSnapshot.ts http://localhost:8787 ../apps/web/public/snapshot || {
            tail -n 80 "$RUNNER_TEMP/server.log"
            exit 1
          }
          # How the AIS feeds did (the API never logs keys or tokens)
          grep -E '\[(aisstream|barentswatch)\]|BW token' "$RUNNER_TEMP/server.log" | tail -n 20 || true
          echo "NEXT_PUBLIC_SNAPSHOT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          # SIGTERM makes the AIS client write its cache for the next run
          kill "$server"
          wait "$server" || true

      - uses: actions/cache/save@v6
        if: ${{ !cancelled() && hashFiles('data/cache/aisstream-snapshot.json') != '' }}
        with:
          path: data/cache/aisstream-snapshot.json
          key: ais-snapshot-${{ github.run_id }}

      - name: Build static site
        env:
          NEXT_PUBLIC_SNAPSHOT: '1'
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_API_BASE_URL: /${{ github.event.repository.name }}/snapshot
        run: pnpm --filter @svalmap/web build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
